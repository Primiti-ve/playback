[package]
name = "playback"
description = "a simple workflow manager"
license = "MIT"
repository = "https://github.com/Primiti-ve/playback"
readme = "../README.md"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pb"
path = "src/main.rs"

[dependencies]
env_logger = { version = "0.11" }

# workspace
clap = { workspace = true }
log = { workspace = true }

# internal
playback-lib = { path = "../lib", version = "0.1.0" }
